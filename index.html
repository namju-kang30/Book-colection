<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>진로 맞춤형 차시별 독서 활동 일지 | Realtime Journal Platform</title>
  
  <meta name="description" content="학생들이 자신의 진로 계열을 선택하고 차시별 독서 활동 일지를 작성하고 공유할 수 있는 반응형 웹 플랫폼" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- SheetJS / XLSX for Excel export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="./css/custom.css" />
</head>
<body class="bg-slate-50 min-h-screen flex flex-col text-slate-900 selection:bg-indigo-500 selection:text-white">

  <!-- Top Navigation Bar Container -->
  <div id="navbar-container"></div>

  <!-- Main Hero & Platform Summary -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 sm:pt-8 w-full">
    <div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-indigo-900 via-indigo-800 to-purple-900 text-white p-6 sm:p-10 shadow-xl shadow-indigo-950/10">
      
      <!-- Subtle Decorative Background Circles -->
      <div class="absolute -right-16 -top-16 w-64 h-64 rounded-full bg-purple-500/20 blur-3xl pointer-events-none"></div>
      <div class="absolute right-1/3 -bottom-16 w-64 h-64 rounded-full bg-indigo-400/20 blur-3xl pointer-events-none"></div>

      <div class="relative z-10 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-6">
        <div class="max-w-2xl">
          <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-white/10 text-indigo-200 border border-white/10 mb-3">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>2026학년도 진로 연계 독서 탐구 프로그램</span>
          </div>
          <h2 class="text-2xl sm:text-3xl lg:text-4xl font-extrabold tracking-tight leading-tight">
            책을 통해 꿈꾸고,<br class="hidden sm:inline" /> 진로를 향해 깊이 있게 탐구합니다.
          </h2>
          <p class="mt-2.5 text-sm sm:text-base text-indigo-200 leading-relaxed">
            나의 진로 계열에 맞는 도서를 읽고 인상 깊은 구절과 진로 연계 통찰을 기록해 보세요. 친구들의 다양한 독서 인사이트도 함께 열람할 수 있습니다.
          </p>
        </div>

        <!-- Quick Quick Action Widget -->
        <div class="flex flex-wrap sm:flex-nowrap items-center gap-3">
          <div class="p-4 rounded-2xl bg-white/10 backdrop-blur-md border border-white/10 text-center flex-1 sm:flex-initial min-w-[120px]">
            <div class="text-2xl font-black text-white" id="stat-total-count">-</div>
            <div class="text-[11px] text-indigo-200 font-medium">누적 제출 일지</div>
          </div>
          <div class="p-4 rounded-2xl bg-white/10 backdrop-blur-md border border-white/10 text-center flex-1 sm:flex-initial min-w-[120px]">
            <div class="text-2xl font-black text-emerald-300" id="stat-active-sessions">-</div>
            <div class="text-[11px] text-indigo-200 font-medium">진행 중 차시</div>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- Main Content Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 w-full flex-1">
    
    <!-- 1. Career Track Selector -->
    <div id="track-selector-container"></div>

    <!-- 2. Session / Date Filter & Search Controls -->
    <div id="session-filter-container"></div>

    <!-- 3. Reading Log Feed Grid -->
    <div id="feed-container"></div>

  </main>

  <!-- Modals -->
  <div id="log-form-modal" class="hidden"></div>
  <div id="log-detail-modal" class="hidden"></div>
  <div id="auth-pin-modal" class="hidden"></div>
  <div id="admin-login-modal" class="hidden"></div>
  <div id="admin-dashboard-modal" class="hidden"></div>
  <div id="supabase-quick-modal" class="hidden"></div>

  <!-- Floating Toast Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="font-bold text-slate-700">진로 맞춤형 차시별 독서 활동 일지</span>
        <span>·</span>
        <span>실시간 웹 플랫폼</span>
      </div>
      <p class="text-slate-400">교사 및 학생을 위한 실시간 연동 독서 플랫폼</p>
    </div>
  </footer>

  <!-- Main App Script Entry -->
  <script type="module">
    import { initApp } from './js/app.js';
    window.addEventListener('DOMContentLoaded', () => {
      initApp();
    });
  </script>
</body>
</html>
